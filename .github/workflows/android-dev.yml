name: Android development verification
on:
  push:
    branches: [main, android-dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: SDK and NDK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Controller tests
        run: cargo test --locked -p mdm-mobile
      - name: Build Android
        run: gradle -p android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-development-unverified-device
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
