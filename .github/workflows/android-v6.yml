name: MDM Android EGUI V6

on:
  push:
    branches: [android-egui-v6]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build nasm libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          cargo install cargo-ndk --version 4.1.2 --locked
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Test original application
        run: |
          cargo test -p mdm-app --lib
          cargo test -p mdm-app --features android-core --lib android
          env -u NO_PROXY -u no_proxy cargo test -p mdm-tools

      - name: Build ARM64 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Pmdm.abis=arm64-v8a --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MDM-EGUI-V6-ARM64
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
